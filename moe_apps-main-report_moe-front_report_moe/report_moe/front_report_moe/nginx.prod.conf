server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Exact matches without a trailing slash first: nginx's own automatic
    # slash-append redirect (triggered by the prefix locations below) builds the
    # Location header from $host, which drops the port — breaking it behind a
    # mapped Docker port. return's own auto-absolutize does the same even with a
    # relative target, so build the URL explicitly with $http_host instead.
    location = /api {
        return 301 $scheme://$http_host/api/;
    }
    location = /admin {
        return 301 $scheme://$http_host/admin/;
    }

    # Matches environment.prod.ts's apiUrl ('/api/v1') and report-web's
    # whitenoise-served /static/ (Django admin).
    location /api/ {
        proxy_pass http://report-web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://report-web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://report-web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
