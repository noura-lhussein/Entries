
name: meters_entry
description: "تطبيق إدخال بيانات وزارة الطاقة — قسم الإدخال."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.5
  freezed_annotation:
  # DI
  get_it: ^9.2.1

  # Navigation
  go_router: ^17.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  # Utils
  uuid: ^4.4.2
  intl: ^0.20.2



  retrofit: ^4.3.1

  # UI
  flutter_animate: ^4.5.0
 
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  flutter_svg: ^2.2.4
  flutter_html: ^3.0.0
  flutter_quill: ^11.0.0
  flutter_quill_delta_from_html: ^1.5.3
  html: ^0.15.0
  #quill_delta:
  url_launcher: ^6.3.2
  vsc_quill_delta_to_html: ^1.0.5
  image_picker: ^1.1.2
  file_picker: ^10.1.9



  # Network — Dio فقط، retrofit runtime
  dio: ^5.4.3
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2

  # Notifications & Permissions
  #flutter_local_notifications: ^18.0.1
 
  shared_preferences: ^2.5.3
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  logger: ^2.6.0  # for logging purpose
  pretty_dio_logger:
  visibility_detector:
  flutter_spinkit:







  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.2
  open_filex:
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
#dart run build_runner watch --delete-conflicting-outputs
  #dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.6.0
  freezed: ^3.2.0
 # hive_generator: ^2.0.1
  json_serializable: ^6.9.0
  retrofit_generator: ^10.2.3
#  flutter_lints: ^6.0.0



flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700